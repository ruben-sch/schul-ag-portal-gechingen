name: Deploy to Hetzner

on:
  push:
    branches: [ main ]
  release:
    types: [published]
  workflow_dispatch:
  workflow_call:
    inputs:
      is_release:
        description: 'Whether it is a production release'
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  # IMAGE_NAME must be lowercase
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up GitHub Actions Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable=${{ github.event_name == 'release' || inputs.is_release == true }}
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/main' && inputs.is_release != true }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # Build for both AMD64 and ARM64
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Copy docker-compose.prod.yml to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "~/schul-ag-portal/"

      - name: Copy Traefik config to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          source: "services/traefik/compose.yml,services/traefik/traefik.prod.toml"
          target: "~/traefik/"
          strip_components: 2

      - name: Deploy to Hetzner VPS
        uses: appleboy/ssh-action@master
        env:
          TRAEFIK_DASHBOARD_USERS: ${{ secrets.TRAEFIK_DASHBOARD_USERS }}
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: TRAEFIK_DASHBOARD_USERS
          script: |
            # Traefik-Zugangsdaten vorbereiten, bevor irgendetwas umgestellt wird
            if [ -n "$TRAEFIK_DASHBOARD_USERS" ]; then
              printf '%s\n' "$TRAEFIK_DASHBOARD_USERS" > ~/traefik/dashboard-users
              chmod 600 ~/traefik/dashboard-users
            fi
            if [ ! -s ~/traefik/dashboard-users ]; then
              echo "GitHub-Secret TRAEFIK_DASHBOARD_USERS fehlt (htpasswd -nbB <user> <passwort>)" >&2
              exit 1
            fi

            # Gemeinsames Netz fuer Traefik und alle Apps
            docker network inspect proxy >/dev/null 2>&1 || docker network create proxy

            # Bestehende Let's-Encrypt-Zertifikate einmalig uebernehmen
            mkdir -p ~/traefik/certificates
            if [ ! -f ~/traefik/certificates/acme.json ] && [ -f ~/schul-ag-portal/traefik-public-certificates/acme.json ]; then
              cp -p ~/schul-ag-portal/traefik-public-certificates/acme.json ~/traefik/certificates/acme.json
            fi

            cd ~/schul-ag-portal/
            
            # GH_TOKEN needed if pulling from private repo on GHCR
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Setup env variables if they don't exist
            if [ ! -f .env ]; then
              echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" > .env
              echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> .env
            fi
            
            # Ensure variables are in .env
            grep -q "^CSRF_TRUSTED_ORIGINS=" .env || echo "CSRF_TRUSTED_ORIGINS=${{ secrets.CSRF_TRUSTED_ORIGINS }}" >> .env
            grep -q "^ALLOWED_HOSTS=" .env || echo "ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}" >> .env
            grep -q "^SMTP_USER=" .env || echo "SMTP_USER=${{ secrets.SMTP_USER }}" >> .env
            grep -q "^SMTP_PASSWORD=" .env || echo "SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}" >> .env
            grep -q "^SMTP_HOST=" .env || echo "SMTP_HOST=${{ secrets.SMTP_HOST }}" >> .env
            grep -q "^SMTP_PORT=" .env || echo "SMTP_PORT=${{ secrets.SMTP_PORT }}" >> .env
            grep -q "^DEFAULT_FROM_EMAIL=" .env || echo "DEFAULT_FROM_EMAIL=${{ secrets.DEFAULT_FROM_EMAIL }}" >> .env
            
            docker compose -f docker-compose.prod.yml pull
            # --remove-orphans entfernt beim ersten Lauf den alten Traefik aus diesem Projekt
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Traefik als eigenes Projekt; startet nur neu, wenn sich etwas geaendert hat
            cd ~/traefik/
            docker compose pull
            docker compose up -d
